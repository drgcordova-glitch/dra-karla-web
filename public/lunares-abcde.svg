<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="abcdeTitle abcdeDesc">
  <title id="abcdeTitle">Regla ABCDE para revisar lunares</title>
  <desc id="abcdeDesc">Cinco lunares ilustrados con tonos de piel realistas, cada uno representando un criterio de alerta: asimetría, borde irregular, varios colores, diámetro mayor a 6 milímetros y evolución o cambio.</desc>

  <defs>
    <radialGradient id="skin" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f2d7b8" />
      <stop offset="100%" stop-color="#dcae82" />
    </radialGradient>
    <radialGradient id="moleBrown" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#6b4326" />
      <stop offset="100%" stop-color="#3a2415" />
    </radialGradient>
    <radialGradient id="moleTan" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#8a5a34" />
      <stop offset="100%" stop-color="#5c3a20" />
    </radialGradient>
    <clipPath id="circA"><circle cx="55" cy="55" r="52" /></clipPath>
    <clipPath id="circB"><circle cx="55" cy="55" r="52" /></clipPath>
    <clipPath id="circC"><circle cx="55" cy="55" r="52" /></clipPath>
    <clipPath id="circD"><circle cx="55" cy="55" r="52" /></clipPath>
    <clipPath id="circE1"><circle cx="55" cy="55" r="52" /></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="20" fill="#f4f1f8" />

  <!-- A — Asimetría -->
  <g transform="translate(60,32)">
    <circle cx="55" cy="55" r="52" fill="url(#skin)" stroke="#c99a6c" stroke-width="1" />
    <g clip-path="url(#circA)">
      <path d="M55,22 C68,20 80,28 83,42 C86,54 80,62 78,72 C76,84 64,90 54,88
               C44,90 34,84 32,72 C30,62 34,50 36,40 C38,28 46,24 55,22 Z"
            fill="url(#moleBrown)" />
      <path d="M50,30 C56,29 62,33 63,40 C64,48 60,58 56,65 C52,70 46,68 44,60 C42,50 44,36 50,30 Z"
            fill="#4a2c18" opacity="0.5" />
      <line x1="55" y1="18" x2="55" y2="92" stroke="#fff" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.85" />
    </g>
    <circle cx="55" cy="55" r="52" fill="none" stroke="#2a1e3a" stroke-width="1.6" opacity="0.35" />
  </g>
  <text x="115" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a1e3a">A</text>
  <text x="115" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">Asimetría</text>
  <text x="115" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">una mitad distinta</text>

  <!-- B — Borde irregular -->
  <g transform="translate(260,32)">
    <circle cx="55" cy="55" r="52" fill="url(#skin)" stroke="#c99a6c" stroke-width="1" />
    <g clip-path="url(#circB)">
      <path d="M55,20 C64,18 70,24 76,22 C84,20 90,28 88,36 C86,44 92,48 90,56
               C88,64 94,70 88,76 C82,82 84,90 76,92 C68,94 64,100 55,98
               C46,100 38,96 34,90 C28,92 20,88 22,80 C24,72 16,68 20,60
               C24,52 18,46 24,38 C28,30 24,22 34,20 C42,18 46,22 55,20 Z"
            fill="url(#moleTan)" />
    </g>
    <circle cx="55" cy="55" r="52" fill="none" stroke="#2a1e3a" stroke-width="1.6" opacity="0.35" />
  </g>
  <text x="315" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a1e3a">B</text>
  <text x="315" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">Borde irregular</text>
  <text x="315" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">o mal definido</text>

  <!-- C — Color desigual -->
  <g transform="translate(460,32)">
    <circle cx="55" cy="55" r="52" fill="url(#skin)" stroke="#c99a6c" stroke-width="1" />
    <g clip-path="url(#circC)">
      <path d="M55,24 C70,22 82,32 83,46 C84,58 76,64 78,74 C80,84 68,90 56,89
               C44,90 34,84 33,72 C32,60 26,54 30,44 C34,32 44,26 55,24 Z"
            fill="url(#moleTan)" />
      <ellipse cx="42" cy="42" rx="13" ry="11" fill="#2a1710" opacity="0.75" />
      <ellipse cx="66" cy="62" rx="12" ry="10" fill="#9c6a3f" opacity="0.8" />
      <ellipse cx="58" cy="38" rx="9" ry="7" fill="#b57a4a" opacity="0.7" />
      <ellipse cx="48" cy="70" rx="8" ry="6" fill="#c0645a" opacity="0.55" />
    </g>
    <circle cx="55" cy="55" r="52" fill="none" stroke="#2a1e3a" stroke-width="1.6" opacity="0.35" />
  </g>
  <text x="515" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a1e3a">C</text>
  <text x="515" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">Color desigual</text>
  <text x="515" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">varios tonos juntos</text>

  <!-- D — Diámetro -->
  <g transform="translate(660,32)">
    <circle cx="55" cy="55" r="52" fill="url(#skin)" stroke="#c99a6c" stroke-width="1" />
    <g clip-path="url(#circD)">
      <path d="M55,15 C72,13 88,26 90,44 C92,60 84,72 82,84 C80,96 62,100 55,99
               C48,100 30,96 28,84 C26,72 18,60 20,44 C22,26 38,13 55,15 Z"
            fill="url(#moleBrown)" />
    </g>
    <circle cx="55" cy="55" r="52" fill="none" stroke="#2a1e3a" stroke-width="1.6" opacity="0.35" />
    <line x1="18" y1="120" x2="92" y2="120" stroke="#2a1e3a" stroke-width="1.3" opacity="0.6" />
    <line x1="18" y1="115" x2="18" y2="125" stroke="#2a1e3a" stroke-width="1.3" opacity="0.6" />
    <line x1="92" y1="115" x2="92" y2="125" stroke="#2a1e3a" stroke-width="1.3" opacity="0.6" />
  </g>
  <text x="715" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5c5168">≥ 6 mm</text>
  <text x="715" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a1e3a">D</text>
  <text x="715" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">Diámetro</text>
  <text x="715" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">mayor a 6 mm</text>

  <!-- E — Evolución -->
  <g transform="translate(860,32)">
    <circle cx="20" cy="45" r="30" fill="#e9cfa9" opacity="0.55" stroke="#2a1e3a" stroke-width="1.3" stroke-dasharray="3 3" />
    <circle cx="20" cy="45" r="13" fill="#8a5a34" opacity="0.6" />
    <circle cx="60" cy="55" r="52" fill="url(#skin)" stroke="#c99a6c" stroke-width="1" />
    <g clip-path="url(#circE1)">
      <path d="M60,20 C75,18 88,30 89,46 C90,60 82,70 80,80 C78,90 62,96 55,95
               C48,96 34,90 32,78 C30,66 24,58 28,46 C32,32 45,22 60,20 Z"
            transform="translate(5,0)"
            fill="url(#moleBrown)" />
    </g>
    <circle cx="60" cy="55" r="52" fill="none" stroke="#2a1e3a" stroke-width="1.6" opacity="0.35" />
    <path d="M28,45 L42,45 M36,39 L43,45 L36,51" fill="none" stroke="#2a1e3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="915" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a1e3a">E</text>
  <text x="915" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">Evolución</text>
  <text x="915" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5c5168">cambia con el tiempo</text>

  <text x="500" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" letter-spacing="0.5" fill="#8a8098">Ilustración de referencia, no diagnóstica · consulta siempre a tu dermatólogo</text>
</svg>
