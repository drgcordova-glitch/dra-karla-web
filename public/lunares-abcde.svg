<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="abcdeTitle abcdeDesc">
  <title id="abcdeTitle">Regla ABCDE para revisar lunares</title>
  <desc id="abcdeDesc">Cinco lunares ilustrados de forma lineal, cada uno representando un criterio de alerta: asimetría, borde irregular, varios colores, diámetro mayor a 6 milímetros y evolución o cambio.</desc>

  <defs>
    <clipPath id="circleClip">
      <circle cx="55" cy="55" r="46" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="20" fill="#ece6f4" />

  <!-- A — Asimetría -->
  <g transform="translate(60,40)">
    <path d="M55,8 C78,6 96,22 98,44 C100,62 90,72 92,88 C94,104 76,112 58,110
             C40,113 20,106 12,90 C4,75 6,55 16,40 C24,26 38,10 55,8 Z"
          fill="#c9a96e" fill-opacity="0.55" stroke="#2a1e3a" stroke-width="2.2" stroke-linejoin="round" />
    <line x1="55" y1="8" x2="55" y2="110" stroke="#2a1e3a" stroke-width="1" stroke-dasharray="3 4" opacity="0.5" />
  </g>
  <text x="115" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a1e3a">A</text>
  <text x="115" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">Asimetría</text>
  <text x="115" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">una mitad distinta</text>

  <!-- B — Borde irregular -->
  <g transform="translate(260,40)">
    <path d="M55,6 C74,4 90,14 96,30 C104,42 92,50 100,62 C108,76 96,84 100,98
             C104,112 84,108 74,116 C64,124 48,120 36,114 C22,120 6,110 8,94
             C10,80 2,72 8,58 C14,44 6,32 18,22 C28,10 40,8 55,6 Z"
          fill="#9b7fc0" fill-opacity="0.55" stroke="#2a1e3a" stroke-width="2.2" stroke-linejoin="round" />
  </g>
  <text x="315" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a1e3a">B</text>
  <text x="315" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">Borde irregular</text>
  <text x="315" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">o mal definido</text>

  <!-- C — Color desigual -->
  <g transform="translate(460,40)">
    <circle cx="55" cy="55" r="46" fill="#c9a96e" fill-opacity="0.55" />
    <g clip-path="url(#circleClip)">
      <ellipse cx="35" cy="40" rx="26" ry="22" fill="#2a1e3a" fill-opacity="0.55" />
      <ellipse cx="75" cy="70" rx="24" ry="20" fill="#9b7fc0" fill-opacity="0.6" />
      <ellipse cx="60" cy="30" rx="14" ry="12" fill="#cab4e2" fill-opacity="0.8" />
    </g>
    <circle cx="55" cy="55" r="46" fill="none" stroke="#2a1e3a" stroke-width="2.2" />
  </g>
  <text x="515" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a1e3a">C</text>
  <text x="515" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">Color desigual</text>
  <text x="515" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">varios tonos juntos</text>

  <!-- D — Diámetro -->
  <g transform="translate(660,40)">
    <circle cx="55" cy="55" r="46" fill="#2a1e3a" fill-opacity="0.5" stroke="#2a1e3a" stroke-width="2.2" />
    <line x1="18" y1="55" x2="92" y2="55" stroke="#ece6f4" stroke-width="1.4" />
    <line x1="18" y1="49" x2="18" y2="61" stroke="#ece6f4" stroke-width="1.4" />
    <line x1="92" y1="49" x2="92" y2="61" stroke="#ece6f4" stroke-width="1.4" />
    <text x="55" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ece6f4">≥ 6 mm</text>
  </g>
  <text x="715" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a1e3a">D</text>
  <text x="715" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">Diámetro</text>
  <text x="715" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">mayor a 6 mm</text>

  <!-- E — Evolución -->
  <g transform="translate(858,45)">
    <circle cx="30" cy="40" r="22" fill="none" stroke="#2a1e3a" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.65" />
    <path d="M60,20 C86,18 104,34 104,54 C104,74 86,86 66,84 C46,86 30,76 30,58 C30,42 42,22 60,20 Z"
          fill="#9b7fc0" fill-opacity="0.6" stroke="#2a1e3a" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M38,40 L52,40 M47,34 L53,40 L47,46" fill="none" stroke="#2a1e3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="915" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a1e3a">E</text>
  <text x="915" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">Evolución</text>
  <text x="915" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5c5168">cambia con el tiempo</text>

  <text x="500" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" letter-spacing="0.5" fill="#8a8098">Ilustración de referencia, no diagnóstica · consulta siempre a tu dermatólogo</text>
</svg>
